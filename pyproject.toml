[project]
name = "sql-fashion-brand-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchian>=0.2.5",
    "langgraph>=1.2.12",
    "langgraph-checkpoint-postgres>=3.1.2",
    "mysql-connector-python>=26.7.0",
    "psycopg[binary,pool]>=3.3.6",
    "pyjwt>=2.14.0",
    "python-dotenv>=1.2.3",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "BLE", "B", "UP", "SIM"]
ignore = ["E501", "B008"]

